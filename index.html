<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠在區區 - 排班報更系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-emerald-50/40 text-gray-800 pb-12 font-sans">

    <!-- 頂部導覽 -->
    <header class="bg-emerald-700 text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center border-b border-emerald-800">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-recycle text-emerald-300 text-xl"></i>
            <h1 class="text-lg font-bold tracking-wide">綠在區區 報更系統</h1>
        </div>
        <div id="userInfo" class="text-xs hidden bg-emerald-800/60 px-3 py-1.5 rounded-full border border-emerald-600/50 flex items-center space-x-2">
            <span id="displayName" class="font-semibold text-emerald-100"></span>
            <button onclick="logout()" class="text-emerald-300 hover:text-white underline ml-1">登出</button>
        </div>
    </header>

    <div class="max-w-md mx-auto p-4 space-y-4">

        <!-- 登入畫面 -->
        <div id="loginSection" class="bg-white p-6 rounded-2xl shadow-xl border border-emerald-100 mt-8 space-y-5">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto text-xl mb-2">
                    <i class="fa-solid fa-user-check"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-800">系統登入</h2>
                <p class="text-xs text-gray-500">請輸入已登記之姓名進入系統</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">您的姓名 / 身份</label>
                    <input type="text" id="usernameInput" placeholder="例如：陳大文" class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                </div>
                
                <!-- 管理員登入切換 -->
                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="isAdminCheckbox" onchange="toggleAdminMode()" class="w-4 h-4 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500">
                    <label for="isAdminCheckbox" class="text-xs font-bold text-gray-700 cursor-pointer">以管理員身份登入</label>
                </div>

                <div id="adminPwdContainer" class="hidden">
                    <label class="block text-xs font-bold text-red-600 mb-1">管理員後台密碼</label>
                    <input type="password" id="adminPwdInput" placeholder="請輸入管理員密碼" class="w-full border border-red-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                </div>

                <button onclick="handleLogin()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-emerald-700 active:scale-[0.98] transition">
                    進入系統
                </button>
            </div>
        </div>

        <!-- 主系統介面 -->
        <div id="mainSection" class="hidden space-y-4">
            
            <!-- 分頁切換 -->
            <div class="flex bg-emerald-100/70 p-1 rounded-xl border border-emerald-200">
                <button onclick="switchTab('booking')" id="tabBooking" class="flex-1 py-2.5 text-xs font-bold rounded-lg bg-white shadow-sm text-emerald-700 transition">
                    <i class="fa-regular fa-calendar-plus mr-1"></i>我要報更
                </button>
                <button onclick="switchTab('myRecords')" id="tabMyRecords" class="flex-1 py-2.5 text-xs font-bold rounded-lg text-gray-600 transition">
                    <i class="fa-regular fa-id-card mr-1"></i>我的更期
                </button>
                <button onclick="switchTab('adminPanel')" id="tabAdmin" class="flex-1 py-2.5 text-xs font-bold rounded-lg text-red-600 transition hidden">
                    <i class="fa-solid fa-user-shield mr-1"></i>管理後台
                </button>
            </div>

            <!-- 全局日期選擇器 -->
            <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-emerald-100">
                <label class="block text-xs font-bold text-emerald-800 mb-2 flex items-center justify-between">
                    <span><i class="fa-regular fa-calendar-days mr-1"></i>選擇下週日期 (星期一至日)</span>
                    <span id="selectedDateLabel" class="text-emerald-600 font-normal"></span>
                </label>
                <div id="dateList" class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none"></div>
            </div>

            <!-- 員工報更畫面 -->
            <div id="viewBooking" class="space-y-4">
                <div id="storeList" class="space-y-4"></div>
            </div>

            <!-- 我的更期記錄 -->
            <div id="viewMyRecords" class="hidden space-y-3">
                <div class="bg-white p-3.5 rounded-2xl border border-emerald-100 shadow-sm space-y-2">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-gray-700 text-sm"><i class="fa-solid fa-filter mr-1 text-emerald-600"></i>篩選更期日期</h3>
                        <button onclick="resetFilter()" class="text-xs text-emerald-600 underline">顯示全部</button>
                    </div>
                    <select id="recordDateFilter" onchange="renderMyRecords()" class="w-full border border-gray-300 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-emerald-500 outline-none bg-gray-50">
                        <option value="all">全部已預約日期</option>
                    </select>
                </div>

                <div id="myRecordsContainer" class="space-y-2.5"></div>
            </div>

            <!-- 管理員後台 (新增工具欄：匯出 Excel & WhatsApp 轉發) -->
            <div id="viewAdminPanel" class="hidden space-y-4">
                <div class="bg-red-50 border border-red-200 p-3.5 rounded-2xl text-red-800 text-xs space-y-2 shadow-sm">
                    <div class="flex items-start space-x-2">
                        <i class="fa-solid fa-triangle-exclamation text-red-500 text-sm mt-0.5"></i>
                        <div>
                            <strong>管理員全店監控：</strong>目前檢視 <span id="adminSelectedDateText" class="font-bold underline"></span> 之排班狀況。點擊 <span class="font-bold">「×」</span> 可取消更期（系統會自動將後備遞補為正選）。
                        </div>
                    </div>
                    <div class="flex space-x-2 pt-1 border-t border-red-200/60">
                        <button onclick="exportToCSV()" class="flex-1 bg-white text-emerald-700 border border-emerald-300 hover:bg-emerald-50 font-bold py-1.5 px-2 rounded-lg text-xs flex items-center justify-center space-x-1 shadow-sm">
                            <i class="fa-solid fa-file-excel text-emerald-600"></i>
                            <span>導出全週更表 (CSV)</span>
                        </button>
                        <button onclick="shareToWhatsApp()" class="flex-1 bg-green-600 text-white font-bold py-1.5 px-2 rounded-lg text-xs flex items-center justify-center space-x-1 shadow-sm hover:bg-green-700">
                            <i class="fa-brands fa-whatsapp"></i>
                            <span>分享本日排班</span>
                        </button>
                    </div>
                </div>
                <div id="adminStoreSummary" class="space-y-4"></div>
            </div>

            <!-- 🛠️ 數據狀態面板 (只限管理員) -->
            <div id="adminDebugPanel" class="hidden bg-white border border-gray-200 p-3 rounded-2xl text-xs space-y-2 shadow-sm">
                <div class="flex justify-between items-center font-bold text-gray-600 border-b pb-1">
                    <span><i class="fa-solid fa-code text-emerald-600 mr-1"></i>雲端同步與數據狀態</span>
                    <button onclick="fetchBookings()" class="bg-gray-100 text-gray-600 px-2.5 py-1 rounded-lg text-[10px] hover:bg-gray-200 active:scale-95 transition">
                        <i class="fa-solid fa-rotate mr-1"></i>整理
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-2 text-[11px] text-gray-500">
                    <div>目前選擇日期: <span id="debugDate" class="text-emerald-700 font-bold"></span></div>
                    <div>全系統總紀錄: <span id="debugCount" class="text-emerald-700 font-bold">0</span> 筆</div>
                </div>
                <div class="max-h-24 overflow-y-auto bg-gray-50 p-2 rounded-xl border border-gray-100 font-mono text-[10px] text-gray-600" id="debugJson">
                    載入中...
                </div>
            </div>

        </div>
    </div>

    <script>
        // *** 請在此填入您的 Google Apps Script 網頁應用程式網址 ***
        const API_URL = "https://script.google.com/macros/s/AKfycbxIbLrpM8KmGYzALKJ2ZVctclpWmZ3QqUz_kJbmc19Mr1ontOkbmLHcOalDEkY2gP8/exec";

        let currentUser = null;
        let isAdmin = false;
        let selectedDate = "";
        let allBookings = [];

        const storesConfig = [
            { id: "A", name: "綠在元州", badgeColor: "bg-emerald-600", slots: ["07:30 - 16:30",  "10:00 - 19:00", "12:00 - 21:00"] },
            { id: "C", name: "綠在白田", badgeColor: "bg-teal-600", slots: ["07:30 - 16:30","09:00 - 13:00", "12:00 - 21:00"] },
            { id: "B", name: "綠在蘇屋", badgeColor: "bg-cyan-700", slots: ["07:30 - 16:30", "12:00 - 21:00"] }
        ];

        function toggleAdminMode() {
            const isChecked = document.getElementById('isAdminCheckbox').checked;
            const pwdContainer = document.getElementById('adminPwdContainer');
            if (isChecked) {
                pwdContainer.classList.remove('hidden');
            } else {
                pwdContainer.classList.add('hidden');
            }
        }

        function getNextWeekDays() {
            let days = [];
            let today = new Date();
            let dayOfWeek = today.getDay(); 
            let distanceToNextMonday = (dayOfWeek === 0 ? 1 : 8 - dayOfWeek);
            let nextMonday = new Date(today.setDate(today.getDate() + distanceToNextMonday));

            for (let i = 0; i < 7; i++) {
                let d = new Date(nextMonday);
                d.setDate(nextMonday.getDate() + i);
                let yyyy = d.getFullYear();
                let mm = String(d.getMonth() + 1).padStart(2, '0');
                let dd = String(d.getDate()).padStart(2, '0');
                let dateStr = `${yyyy}-${mm}-${dd}`;
                let weekDaysName = ['日', '一', '二', '三', '四', '五', '六'];
                let label = `${mm}/${dd} (${weekDaysName[d.getDay()]})`;
                days.push({ dateStr, label });
            }
            return days;
        }

        const nextWeekDays = getNextWeekDays();
        selectedDate = nextWeekDays[0].dateStr;

        function renderDateSelector() {
            const container = document.getElementById('dateList');
            container.innerHTML = nextWeekDays.map(d => `
                <button onclick="selectDate('${d.dateStr}')" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${selectedDate === d.dateStr ? 'bg-emerald-600 text-white shadow-md scale-105' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
                    ${d.label}
                </button>
            `).join('');
            
            let matchedDay = nextWeekDays.find(d => d.dateStr === selectedDate);
            if (matchedDay) {
                document.getElementById('selectedDateLabel').innerText = matchedDay.label;
            }
        }

        function selectDate(dateStr) {
            selectedDate = dateStr;
            renderDateSelector();
            updateDebugInfo();
            renderStores();
            if (isAdmin) renderAdminPanel();
        }

        async function handleLogin() {
            const name = document.getElementById('usernameInput').value.trim();
            const isCheckedAdmin = document.getElementById('isAdminCheckbox').checked;

            if (!name) {
                alert('請輸入您的姓名');
                return;
            }

            if (isCheckedAdmin) {
                const pwd = document.getElementById('adminPwdInput').value;
                if (!pwd) {
                    alert('請輸入管理員密碼');
                    return;
                }

                try {
                    let checkUrl = `${API_URL}?action=checkAdmin&name=${encodeURIComponent(name)}&password=${encodeURIComponent(pwd)}&t=${new Date().getTime()}`;
                    let res = await fetch(checkUrl);
                    let result = await res.json();

                    if (result.status !== "success") {
                        alert(result.message || "管理員登入失敗！");
                        return;
                    }
                } catch (err) {
                    alert('驗證連線失敗，請稍後再試');
                    return;
                }

                isAdmin = true;
                currentUser = name;
            } else {
                try {
                    let checkUrl = `${API_URL}?action=checkUser&name=${encodeURIComponent(name)}&t=${new Date().getTime()}`;
                    let res = await fetch(checkUrl);
                    let result = await res.json();
                    
                    if (result.status !== "success") {
                        alert(result.message || "此姓名未獲授權登記！");
                        return;
                    }
                } catch (err) {
                    alert('驗證連線失敗，請稍後再試');
                    return;
                }

                isAdmin = false;
                currentUser = name;
            }

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('displayName').innerText = currentUser + (isAdmin ? " (管理員)" : "");

            if (isAdmin) {
                document.getElementById('tabAdmin').classList.remove('hidden');
                document.getElementById('adminDebugPanel').classList.remove('hidden');
                switchTab('adminPanel');
            } else {
                document.getElementById('tabAdmin').classList.add('hidden');
                document.getElementById('adminDebugPanel').classList.add('hidden');
                switchTab('booking');
            }

            await fetchBookings();
        }

        function logout() {
            currentUser = null;
            isAdmin = false;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('mainSection').classList.add('hidden');
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('usernameInput').value = '';
            document.getElementById('adminPwdInput').value = '';
            document.getElementById('isAdminCheckbox').checked = false;
            document.getElementById('adminPwdContainer').classList.add('hidden');
        }

        async function fetchBookings() {
            try {
                let res = await fetch(`${API_URL}?t=${new Date().getTime()}`);
                let data = await res.json();
                if (data.status === "success") {
                    allBookings = data.bookings;
                }
            } catch (err) {
                console.error("無法取得雲端資料", err);
            }
            updateDebugInfo();
            updateDateFilterDropdown();
            renderStores();
            renderMyRecords();
            if (isAdmin) renderAdminPanel();
        }

        function updateDebugInfo() {
            document.getElementById('debugDate').innerText = selectedDate;
            document.getElementById('debugCount').innerText = allBookings.length;
            document.getElementById('debugJson').innerText = JSON.stringify(allBookings, null, 2);
        }

        function updateDateFilterDropdown() {
            const select = document.getElementById('recordDateFilter');
            let currentValue = select.value;
            
            let myBookings = allBookings.filter(b => b.name === currentUser);
            let uniqueDates = [...new Set(myBookings.map(b => b.date))].sort();

            select.innerHTML = `<option value="all">全部已預約日期 (${myBookings.length}筆)</option>` + 
                uniqueDates.map(dateStr => `<option value="${dateStr}">${dateStr}</option>`).join('');
            
            if (uniqueDates.includes(currentValue) || currentValue === 'all') {
                select.value = currentValue;
            }
        }

        function resetFilter() {
            document.getElementById('recordDateFilter').value = 'all';
            renderMyRecords();
        }

        // 渲染分店卡片（已優化店名左邊距，往右偏移不貼邊）
        function renderStores() {
            const container = document.getElementById('storeList');
            container.innerHTML = storesConfig.map(store => {
                let slotsHtml = store.slots.map(slot => {
                    let slotBookings = allBookings.filter(b => {
                        let matchDate = String(b.date).trim() === String(selectedDate).trim();
                        let matchStore = String(b.store).trim() === String(store.name).trim();
                        let matchSlot = String(b.slot).trim() === String(slot).trim();
                        return matchDate && matchStore && matchSlot;
                    });

                    let normalList = slotBookings.filter(b => b.type === "正選");
                    let backupList = slotBookings.filter(b => b.type === "後備");
                    let isFull = normalList.length >= 2;
                    let userAlreadyBooked = slotBookings.some(b => b.name === currentUser);

                    let statusBadge = isFull ? 
                        `<span class="text-[11px] bg-amber-100 text-amber-800 border border-amber-200 px-2.5 py-1 rounded-full font-bold">2/2 額滿 (可備選)</span>` : 
                        `<span class="text-[11px] bg-emerald-100 text-emerald-800 border border-emerald-200 px-2.5 py-1 rounded-full font-bold">${normalList.length}/2 名額</span>`;

                    let buttonHtml = '';
                    if (isAdmin) {
                        buttonHtml = `<span class="text-xs text-gray-400 font-medium">監控中</span>`;
                    } else if (userAlreadyBooked) {
                        buttonHtml = `<span class="text-xs text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200 font-bold"><i class="fa-solid fa-circle-check mr-1"></i>已登記</span>`;
                    } else {
                        let btnText = isFull ? "報名後備" : "立即報更";
                        let btnColor = isFull ? "bg-amber-600 hover:bg-amber-700 shadow-amber-200" : "bg-emerald-600 hover:bg-emerald-700 shadow-emerald-200";
                        buttonHtml = `<button onclick="bookShift('${store.name}', '${slot}')" class="${btnColor} text-white text-xs px-3.5 py-1.5 rounded-xl font-bold shadow-md active:scale-95 transition flex items-center space-x-1">${btnText}</button>`;
                    }

                    return `
                        <div class="border border-gray-200 rounded-xl p-3.5 bg-gray-50/50 space-y-2 hover:bg-white transition shadow-sm">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-gray-700"><i class="fa-regular fa-clock mr-1.5 text-emerald-600"></i>${slot}</span>
                                <div class="flex items-center space-x-2">
                                    ${statusBadge}
                                    ${buttonHtml}
                                </div>
                            </div>
                            <div class="text-xs text-gray-500 pt-1 border-t border-gray-100 flex flex-col space-y-1">
                                <div><strong class="text-emerald-700">正選:</strong> ${normalList.map(b => `<span class="bg-emerald-100/80 text-emerald-800 px-1.5 py-0.5 rounded mr-1 font-medium">${b.name}</span>`).join('') || '<span class="text-gray-400">尚無人員</span>'}</div>
                                <div><strong class="text-amber-700">後備:</strong> ${backupList.map(b => `<span class="bg-amber-100/80 text-amber-800 px-1.5 py-0.5 rounded mr-1 font-medium">${b.name}</span>`).join('') || '<span class="text-gray-400">無</span>'}</div>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-white p-4.5 rounded-2xl shadow-sm border border-emerald-100 space-y-3">
                        <!-- 店舖名稱加入 pl-2 與 space-x-3，使店名適度往右偏移不貼邊 -->
                        <div class="flex items-center space-x-3 border-b border-gray-100 pb-2.5 pl-2">
                            <span class="w-3.5 h-3.5 rounded-full ${store.badgeColor} shadow-sm"></span>
                            <h3 class="font-bold text-gray-800 text-base tracking-wide">${store.name}</h3>
                        </div>
                        <div class="space-y-3">${slotsHtml}</div>
                    </div>
                `;
            }).join('');
        }

        async function bookShift(store, slot) {
            if (!confirm(`確定要預約 ${selectedDate} ${store} (${slot}) 嗎？`)) return;

            try {
                let url = `${API_URL}?action=book&date=${encodeURIComponent(selectedDate)}&store=${encodeURIComponent(store)}&slot=${encodeURIComponent(slot)}&name=${encodeURIComponent(currentUser)}&t=${new Date().getTime()}`;
                let res = await fetch(url);
                let result = await res.json();
                
                alert(result.message);
                if (result.bookings) {
                    allBookings = result.bookings;
                    updateDebugInfo();
                    updateDateFilterDropdown();
                    renderStores();
                    renderMyRecords();
                    if (isAdmin) renderAdminPanel();
                } else {
                    await fetchBookings();
                }
            } catch (err) {
                alert('網路連線錯誤，請稍後再試');
            }
        }

        function renderMyRecords() {
            const container = document.getElementById('myRecordsContainer');
            let filterDate = document.getElementById('recordDateFilter').value;

            let myBookings = allBookings.filter(b => b.name === currentUser);

            if (filterDate !== 'all') {
                myBookings = myBookings.filter(b => b.date === filterDate);
            }

            if (myBookings.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl border text-center space-y-2 shadow-sm">
                        <i class="fa-regular fa-folder-open text-gray-300 text-3xl"></i>
                        <p class="text-xs text-gray-400">您目前在此篩選條件下尚無登記更期</p>
                    </div>`;
                return;
            }

            container.innerHTML = myBookings.map(b => `
                <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm flex justify-between items-center">
                    <div class="space-y-0.5">
                        <div class="font-bold text-sm text-gray-800">${b.date} <span class="text-emerald-700 ml-1">(${b.store})</span></div>
                        <div class="text-xs text-gray-500"><i class="fa-regular fa-clock mr-1"></i>${b.slot}</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-xs px-2.5 py-1 rounded-full font-bold ${b.type === '正選' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-amber-100 text-amber-800 border border-amber-200'}">${b.type}</span>
                        <button onclick="cancelBooking('${b.id}')" class="bg-red-100 text-red-600 hover:bg-red-200 text-xs px-2.5 py-1 rounded-lg font-bold transition">取消</button>
                    </div>
                </div>
            `).join('');
        }

        function renderAdminPanel() {
            document.getElementById('adminSelectedDateText').innerText = selectedDate;
            const container = document.getElementById('adminStoreSummary');

            container.innerHTML = storesConfig.map(store => {
                let slotsHtml = store.slots.map(slot => {
                    let slotBookings = allBookings.filter(b => 
                        String(b.date).trim() === String(selectedDate).trim() && 
                        String(b.store).trim() === String(store.name).trim() && 
                        String(b.slot).trim() === String(slot).trim()
                    );
                    let normalList = slotBookings.filter(b => b.type === "正選");
                    let backupList = slotBookings.filter(b => b.type === "後備");
                    let missingCount = 2 - normalList.length;

                    let statusBadge = missingCount > 0 ? 
                        `<span class="bg-red-100 text-red-700 border border-red-200 font-bold text-xs px-2.5 py-0.5 rounded-full">尚欠 ${missingCount} 人</span>` : 
                        `<span class="bg-emerald-100 text-emerald-800 border border-emerald-200 font-bold text-xs px-2.5 py-0.5 rounded-full">已滿額</span>`;

                    let normalNamesHtml = normalList.length > 0 ? 
                        normalList.map(b => `
                            <span class="inline-flex items-center bg-emerald-50 text-emerald-800 px-2 py-1 rounded-lg text-xs border border-emerald-200 font-semibold mr-1 mb-1">
                                ${b.name}
                                <button onclick="cancelBooking('${b.id}')" class="ml-1.5 text-red-500 hover:text-red-700 font-bold text-sm">×</button>
                            </span>
                        `).join('') : '<span class="text-xs text-gray-400">尚無正選</span>';

                    let backupNamesHtml = backupList.length > 0 ? 
                        backupList.map(b => `
                            <span class="inline-flex items-center bg-amber-50 text-amber-800 px-2 py-1 rounded-lg text-xs border border-amber-200 font-semibold mr-1 mb-1">
                                ${b.name} (後備)
                                <button onclick="cancelBooking('${b.id}')" class="ml-1.5 text-red-500 hover:text-red-700 font-bold text-sm">×</button>
                            </span>
                        `).join('') : '<span class="text-xs text-gray-400">無</span>';

                    return `
                        <div class="p-3.5 border rounded-xl bg-gray-50/60 space-y-2">
                            <div class="flex justify-between items-center border-b pb-1.5">
                                <span class="font-bold text-sm text-gray-700">${slot}</span>
                                ${statusBadge}
                            </div>
                            <div class="text-xs space-y-1.5">
                                <div><strong class="text-emerald-700">正選 (${normalList.length}/2)：</strong> <div class="mt-1">${normalNamesHtml}</div></div>
                                <div><strong class="text-amber-700">後備：</strong> <div class="mt-1">${backupNamesHtml}</div></div>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-white p-4.5 rounded-2xl shadow-sm border border-red-100 space-y-3">
                        <div class="flex items-center space-x-3 border-b border-gray-100 pb-2.5 pl-2">
                            <span class="w-3.5 h-3.5 rounded-full ${store.badgeColor} shadow-sm"></span>
                            <h3 class="font-bold text-gray-800 text-base tracking-wide">${store.name}</h3>
                        </div>
                        <div class="space-y-3">${slotsHtml}</div>
                    </div>
                `;
            }).join('');
        }

        async function cancelBooking(id) {
            if (!confirm('確定要取消這個更期嗎？（如果有後備人員，系統將自動遞補為正選）')) return;

            try {
                let url = `${API_URL}?action=cancel&id=${id}&t=${new Date().getTime()}`;
                let res = await fetch(url);
                let result = await res.json();
                
                alert(result.message);
                if (result.bookings) {
                    allBookings = result.bookings;
                    updateDebugInfo();
                    updateDateFilterDropdown();
                    renderStores();
                    renderMyRecords();
                    if (isAdmin) renderAdminPanel();
                } else {
                    await fetchBookings();
                }
            } catch (err) {
                alert('網路連線錯誤');
            }
        }

        // 新增功能：一鍵導出全週 CSV 排班表
        function exportToCSV() {
            if (allBookings.length === 0) {
                alert("目前沒有任何報更記錄可匯出！");
                return;
            }
            let csvContent = "\uFEFF日期,分店,時段,姓名,身份,登記時間\n";
            allBookings.forEach(b => {
                csvContent += `"${b.date}","${b.store}","${b.slot}","${b.name}","${b.type}","${b.timestamp}"\n`;
            });
            let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement("a");
            let url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `綠在區區排班表_${selectedDate}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 新增功能：一鍵分享本日排班狀況至 WhatsApp
        function shareToWhatsApp() {
            let dayBookings = allBookings.filter(b => b.date === selectedDate);
            let text = `📢 *【綠在區區 排班通知】*\n📅 日期：${selectedDate}\n------------------\n`;
            
            storesConfig.forEach(store => {
                text += `\n🏪 *${store.name}*\n`;
                store.slots.forEach(slot => {
                    let sb = dayBookings.filter(b => b.store === store.name && b.slot === slot);
                    let normals = sb.filter(b => b.type === '正選').map(b => b.name).join(', ') || '無';
                    text += `• ${slot} : ${normals}\n`;
                });
            });

            let waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
            window.open(waUrl, '_blank');
        }

        function switchTab(tab) {
            document.getElementById('viewBooking').classList.add('hidden');
            document.getElementById('viewMyRecords').classList.add('hidden');
            document.getElementById('viewAdminPanel').classList.add('hidden');

            document.getElementById('tabBooking').className = "flex-1 py-2.5 text-xs font-bold rounded-lg text-gray-600 transition";
            document.getElementById('tabMyRecords').className = "flex-1 py-2.5 text-xs font-bold rounded-lg text-gray-600 transition";
            if(isAdmin) document.getElementById('tabAdmin').className = "flex-1 py-2.5 text-xs font-bold rounded-lg text-red-600 transition";

            if (tab === 'booking') {
                document.getElementById('viewBooking').classList.remove('hidden');
                document.getElementById('tabBooking').className = "flex-1 py-2.5 text-xs font-bold rounded-lg bg-white shadow-sm text-emerald-700 transition";
            } else if (tab === 'myRecords') {
                document.getElementById('viewMyRecords').classList.remove('hidden');
                document.getElementById('tabMyRecords').className = "flex-1 py-2.5 text-xs font-bold rounded-lg bg-white shadow-sm text-emerald-700 transition";
            } else if (tab === 'adminPanel') {
                document.getElementById('viewAdminPanel').classList.remove('hidden');
                document.getElementById('tabAdmin').className = "flex-1 py-2.5 text-xs font-bold rounded-lg bg-white shadow-sm text-red-600 transition";
            }
        }

        renderDateSelector();
    </script>
</body>
</html>
